name: secrets
description: Credentials and key material.
defs:
  secret_paths: &secret_paths
    - "~/.ssh"
    - "~/.ssh/**"
    - "**/.ssh/**"
    - "~/.aws"
    - "~/.aws/**"
    - "**/.aws/**"
    - "~/.gnupg"
    - "~/.gnupg/**"
    - "**/.gnupg/**"
    - "~/.netrc"
    - "~/.git-credentials"
    - "**/.git-credentials"
    - "~/.pgpass"
    - "~/.my.cnf"
    - "~/.config/gcloud/**"
    - "~/.config/gh/hosts.yml"
    - "~/.azure/**"
    - "~/.kube/config"
    - "~/.docker/config.json"
    - "~/Library/Keychains/**"
    - "**/.env"
    - "**/.env.*"
    - "**/*.pem"
    - "**/*.key"
    - "**/*.p12"
    - "**/id_rsa*"
    - "**/id_ed25519*"
    - "**/*.keychain*"
    - "**/.npmrc"
    - "**/.pypirc"
    - "**/credentials.json"
    - "/etc/shadow"
    - "/etc/gshadow"
    - "/etc/sudoers"
    - "/etc/sudoers.d/**"
    - "/etc/ssl/private/**"
    - "/proc/*/environ"
rules:
  - id: secrets-exfil
    match:
      network_use: true
      path: *secret_paths
    action: deny
    reason: secret files must not be sent over the network
  - id: secrets-env-exfil
    match: {secret_env: true, network_use: true}
    action: deny
    reason: secret environment variables must not be sent over the network
  - id: secrets-access
    match:
      path: *secret_paths
    action: ask
    reason: access to credentials needs a human
  - id: secrets-env-print
    match: {secret_env: true}
    action: ask
    reason: printing or using a secret environment variable puts it in the agent context
