name: secrets
description: Credentials and key material.
rules:
  - id: secrets-exfil
    match:
      network_use: true
      path:
        - "~/.ssh/**"
        - "**/.ssh/**"
        - "**/.aws/**"
        - "**/.gnupg/**"
        - "~/.aws/**"
        - "~/.gnupg/**"
        - "~/.netrc"
        - "~/.config/gcloud/**"
        - "~/.kube/config"
        - "~/.docker/config.json"
        - "~/Library/Keychains/**"
        - "**/.env"
        - "**/.env.*"
        - "**/*.pem"
        - "**/*.key"
        - "**/*.p12"
        - "**/id_rsa*"
        - "**/id_ed25519*"
        - "**/*.keychain*"
        - "**/.npmrc"
        - "**/.pypirc"
        - "**/credentials.json"
    action: deny
    reason: secret files must not be sent over the network
  - id: secrets-env-exfil
    match: {secret_env: true, network_use: true}
    action: deny
    reason: secret environment variables must not be sent over the network
  - id: secrets-access
    match:
      path:
        - "~/.ssh/**"
        - "**/.ssh/**"
        - "**/.aws/**"
        - "**/.gnupg/**"
        - "~/.aws/**"
        - "~/.gnupg/**"
        - "~/.netrc"
        - "~/.config/gcloud/**"
        - "~/.kube/config"
        - "~/.docker/config.json"
        - "~/Library/Keychains/**"
        - "**/.env"
        - "**/.env.*"
        - "**/*.pem"
        - "**/*.key"
        - "**/*.p12"
        - "**/id_rsa*"
        - "**/id_ed25519*"
        - "**/*.keychain*"
        - "**/.npmrc"
        - "**/.pypirc"
        - "**/credentials.json"
    action: ask
    reason: access to credentials needs a human
