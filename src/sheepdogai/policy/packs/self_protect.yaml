# self_protect: always first, cannot be disabled. The agent may not change the rules file,
# the hook configuration or the log directory without a human. Reads are not affected.
name: self_protect
description: Protect the guard from the thing it guards.
rules:
  - id: sp-approval-secrets
    match:
      path: ["**/{state}/approved/**", "**/{state}/approved", "**/{state}/approval.key", "**/{state}/approval.used"]
    action: deny
    reason: approvals belong to the human; the agent may not read, write or answer them
  - id: sp-cli-self-management
    match:
      command: ["{cli} approve*", "{cli} uninstall*", "{cli} install*", "{cli} init*", "{cli} daemon*"]
    action: deny
    reason: the agent may not change or approve its own guard
  - id: sp-rules-and-hooks
    match:
      mutates: true
      path:
        - "{config}"
        - "{config_alt}"
        - "**/{state}/shared.yaml"
        - "**/.claude/settings.json"
        - "**/.claude/settings.local.json"
        - "~/.claude/settings.json"
        - "**/.codex/hooks.json"
        - "**/.codex/config.toml"
        - "~/.codex/hooks.json"
        - "~/.codex/config.toml"
        - "**/.gemini/settings.json"
        - "~/.gemini/settings.json"
    action: ask
    reason: edits to the rules file or hook configuration need a human
  - id: sp-log-dir
    match:
      mutates: true
      path: ["**/{state}/**", "{project}/{state}"]
    action: deny
    reason: the run log directory is append-only and not editable by the agent
  - id: sp-kill-daemon
    match:
      command: ["re:\\b(pkill|killall)\\b.{0,40}{cli}", "re:\\bkill\\b.{0,20}{cli}"]
    action: ask
    reason: stopping the guard needs a human
