# pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: 3d44372123ca5e8617fdb65d9f11facd159b9e95  # v0.12.3
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/gitleaks/gitleaks
    rev: c7acf33d962e8effc070072f993c365af19e3661  # v8.27.2 (secret scanner)
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: mypy-strict
        name: mypy --strict
        entry: uv run mypy --strict
        language: system
        pass_filenames: false
        types: [python]
      - id: no-unverified-outside-experimental
        name: UNVERIFIED only in experimental adapters, docs and tests
        entry: python tools/check_hygiene.py
        language: system
        pass_filenames: false
