# Team repository: commit this file (it needs review like code). Strict by default.
version: 1
mode: strict
fail: closed
packs: [self_protect, machine, secrets, repo, network, injection]
budget: {max_steps: 200, max_cost_usd: 5, max_repeats: 3}
approvals: {ask_timeout_s: 60, remember: session}
log: {path: .sheepdogai/runs, hash_chain: true, redact_secrets: true}
rules:
  - id: no-force-push
    match: {tool: Bash, command: ["git push --force*", "git push -f*"]}
    action: deny
    reason: force-push rewrites shared history
  - id: no-release-tags
    match: {tool: Bash, command: ["git tag -d*", "git push * --delete *"]}
    action: deny
    reason: releases are cut by CI only
  - id: allow-read-tools
    match: {kind: file_read}
    action: allow
