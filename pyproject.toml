[build-system]
requires = ["hatchling==1.33.0"]
build-backend = "hatchling.build"

[project]
name = "sheepdogai"
version = "0.1.5"
description = "Framework-agnostic safety and observability gate for AI agent tool calls."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = ["pyyaml>=6.0.2,<7", "pydantic>=2.9,<3"]

[project.urls]
Homepage = "https://github.com/neoparadigm/sheepdog.ai"
Repository = "https://github.com/neoparadigm/sheepdog.ai"
Issues = "https://github.com/neoparadigm/sheepdog.ai/issues"
Security = "https://github.com/neoparadigm/sheepdog.ai/security/policy"

[project.optional-dependencies]
otel = ["opentelemetry-api>=1.27,<2"]
rdf = ["rdflib>=7.0,<8", "pyshacl>=0.26,<1"]
notify = []
docs = ["mkdocs>=1.6,<2"]
dev = [
  "pytest>=8.3,<10", "hypothesis>=6.112,<7", "pytest-cov>=5,<8",
  "mypy>=1.11,<3", "ruff>=0.6,<1", "types-PyYAML",
  "rdflib>=7.0,<8", "pyshacl>=0.26,<1",
]

[project.scripts]
sheepdogai = "sheepdogai.cli.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/sheepdogai"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "agents", "bench"]
[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]
ignore = ["E501", "S101", "S603", "S607", "S108", "SIM102", "SIM103"]
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "B011", "E501"]
"bench/**" = ["S"]

[tool.mypy]
strict = true
python_version = "3.11"
mypy_path = "src"
packages = ["sheepdogai"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -p no:cacheprovider"
pythonpath = ["src", "."]
markers = ["e2e: needs a real CLI and SHEEPDOGAI_E2E=1"]

[tool.coverage.run]
source = ["sheepdogai"]
branch = true
[tool.coverage.report]
fail_under = 90
include = ["*/sheepdogai/core/*", "*/sheepdogai/policy/*", "*/sheepdogai/log/*",
           "*/sheepdogai/redact/*", "*/sheepdogai/budget/*"]

[[tool.mypy.overrides]]
module = ["opentelemetry", "opentelemetry.*"]
ignore_missing_imports = true
