name: release
# Tag v* -> build sdist+wheel, CycloneDX SBOM, Sigstore signatures, PyPI trusted publishing.
# No long-lived tokens: PyPI uses OIDC. Do not publish before the project name is decided.
on:
  push:
    tags: ["v*"]
permissions: read-all
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
      - run: make setup && make verify
      - name: Build sdist and wheel
        run: uv build
      - name: SBOM (CycloneDX)
        run: uv run --with cyclonedx-bom==9.0.0 cyclonedx-py environment --of JSON -o dist/sbom.cdx.json .venv
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
  sign:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: sigstore/gh-action-sigstore-python@790bc6befb9d733738f18d8f895854b453640ec9 # v3.5.0
        with:
          inputs: dist/*.whl dist/*.tar.gz dist/sbom.cdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-signed
          path: dist/
  publish:
    needs: sign
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist-signed
          path: dist/
      - name: Keep only the wheel and sdist (PyPI rejects the SBOM and signature files)
        run: mkdir upload && cp dist/*.whl dist/*.tar.gz upload/ && ls -l upload
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: upload/
