name: release
# Tag v* -> build sdist+wheel, CycloneDX SBOM, Sigstore signatures, PyPI trusted publishing.
# No long-lived tokens: PyPI uses OIDC. Do not publish before the project name is decided.
on:
  push:
    tags: ["v*"]
permissions: read-all
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          python-version: "3.13"
      - run: make setup && make verify
      - name: Build sdist and wheel
        run: uv build
      - name: SBOM (CycloneDX)
        run: uv run --with cyclonedx-bom==9.0.0 cyclonedx-py environment --of JSON -o dist/sbom.cdx.json .venv
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
  sign:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist/
      - uses: sigstore/gh-action-sigstore-python@f514d46b907ebcd5bedc05145c03b69c1edd8b46 # v3.0.0
        with:
          inputs: dist/*.whl dist/*.tar.gz dist/sbom.cdx.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist-signed
          path: dist/
  publish:
    needs: sign
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist-signed
          path: dist/
      - name: Keep only the wheel and sdist (PyPI rejects the SBOM and signature files)
        run: mkdir upload && cp dist/*.whl dist/*.tar.gz upload/ && ls -l upload
      - uses: pypa/gh-action-pypi-publish@76f52bc884231f62b9a034ebfe128415bbaabdfc # v1.12.4
        with:
          packages-dir: upload/
