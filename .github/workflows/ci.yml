name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions: read-all
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install (locked, hash-checked)
        run: make setup
      - name: Verify (lint, mypy --strict, all suites, latency gate)
        run: make verify
      - name: Benchmark report
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: make bench
      - name: Upload benchmark report
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: injection-gauntlet-report
          path: |
            bench/report.md
            bench/report.json
            tests/perf/last_run.json
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          python-version: "3.13"
      - name: Build and lint docs (strict)
        run: |
          uv sync --extra dev --extra docs --frozen
          uv run mkdocs build --strict
