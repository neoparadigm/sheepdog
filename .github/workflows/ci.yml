name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions: read-all
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    name: verify (py${{ matrix.python }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          python-version: ${{ matrix.python }}
      - name: Install (locked, hash-checked)
        run: make setup
      - name: Verify (lint, mypy --strict, all suites, latency gate)
        run: make verify
      - name: Benchmark report
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: make bench
      - name: Upload benchmark report
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: injection-gauntlet-report
          path: |
            bench/report.md
            bench/report.json
            tests/perf/last_run.json
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@6b9c6063abd6010835644d4c2e1bef4cf5cd0fca # v6.0.1
        with:
          python-version: "3.13"
      - name: Build and lint docs (strict)
        run: |
          uv sync --extra dev --extra docs --frozen
          uv run mkdocs build --strict
